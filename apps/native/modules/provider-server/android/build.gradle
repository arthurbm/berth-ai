plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.providerserver'
version = '0.7.10'

android {
  namespace "expo.modules.providerserver"
  defaultConfig {
    versionCode 1
    versionName "0.7.10"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "org.nanohttpd:nanohttpd:2.3.1"
}
